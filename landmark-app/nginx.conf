server {
    listen 80;
    server_name studyflowai.store www.studyflowai.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API로 가는 요청을 프록시 설정할 수도 있지만, 
    # 현재는 프론트엔드 코드 내에 전체 URL이 적혀 있으므로 
    # 기본적인 정적 파일 서빙 설정만 유지합니다.

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
